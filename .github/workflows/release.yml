name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_app/package-lock.json
      - name: Build frontend
        working-directory: web_app
        run: |
          npm ci
          npm run build
      - name: Install Hatch
        run: python -m pip install hatch
      - name: Build wheel and source distribution
        run: python -m hatch build
      - name: Build Windows one-click ZIP
        run: python scripts/build_oneclick_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/modern-iopaint-oneclick-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/modern-iopaint-oneclick-*.zip

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # TODO(repo owner): Once PyPI Trusted Publishing or credentials are configured,
    # set the repository variable PYPI_PUBLISH_ENABLED to `true` to enable this job.
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modern-iopaint/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      # TODO(repo owner): In PyPI, add this repository/workflow/environment as a
      # Trusted Publisher before the first tagged release. No API token is used.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
