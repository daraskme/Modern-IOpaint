[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modern-iopaint"
version = "0.1.0.dev0"
description = "A modernized fork of IOPaint for image inpainting and outpainting"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "PanicByte", email = "cwq1913@gmail.com" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0.0",
  "opencv-python",
  "diffusers==0.27.2",
  "huggingface_hub==0.25.2",
  "accelerate",
  "peft==0.7.1",
  "transformers>=4.39.1",
  "safetensors",
  "controlnet-aux==0.0.3",
  "fastapi==0.108.0",
  "uvicorn",
  "python-multipart",
  "python-socketio==5.7.2",
  "typer",
  "pydantic>=2.5.2",
  "rich",
  "loguru",
  "yacs",
  "piexif==1.1.3",
  "omegaconf",
  "easydict",
  "gradio==4.21.0",
  "typer-config==1.4.0",
  "Pillow==9.5.0",
]

[project.scripts]
modern-iopaint = "modern_iopaint:entry_point"

[project.urls]
Upstream = "https://github.com/Sanster/IOPaint"

[dependency-groups]
dev = [
  "wheel",
  "twine",
  "pytest-loguru",
]

[tool.hatch.build]
artifacts = [
  "modern_iopaint/web_app/**/*",
  "modern_iopaint/model/anytext/**/*.txt",
  "modern_iopaint/model/anytext/**/*.yaml",
  "modern_iopaint/model/original_sd_configs/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["modern_iopaint"]
