[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modern-iopaint"
version = "0.1.0.dev0"
description = "A modernized fork of IOPaint for image inpainting and outpainting"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "PanicByte", email = "cwq1913@gmail.com" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch~=2.11.0",
  "opencv-python",
  "diffusers==0.36.0",
  "huggingface_hub==0.36.2",
  "accelerate==1.14.0",
  "peft==0.20.0",
  "transformers==4.57.6",
  "safetensors",
  "fastapi>=0.141.1,<1",
  "uvicorn",
  "python-multipart",
  "python-socketio>=5.16.3,<6",
  "typer>=0.27.1,<1",
  "pydantic>=2.13.4,<3",
  "rich",
  "loguru",
  "yacs",
  "piexif==1.1.3",
  "omegaconf",
  "easydict",
  "typer-config==1.4.0",
  "Pillow>=10",
]

[project.scripts]
modern-iopaint = "modern_iopaint:entry_point"

[project.urls]
Upstream = "https://github.com/Sanster/IOPaint"

[dependency-groups]
dev = [
  "hatch",
  "ruff",
  "wheel",
  "twine",
  "pytest-loguru",
]

[tool.hatch.build]
artifacts = [
  "modern_iopaint/gpu_wheels.json",
  "modern_iopaint/model_manifest.json",
  "modern_iopaint/web_app/**/*",
  "modern_iopaint/model/legacy/anytext/**/*.txt",
  "modern_iopaint/model/legacy/anytext/**/*.yaml",
  "modern_iopaint/model/original_sd_configs/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["modern_iopaint"]

[tool.hatch.build.targets.wheel.force-include]
"web_app/dist" = "modern_iopaint/web_app"

[tool.hatch.build.targets.sdist.force-include]
"web_app/dist" = "web_app/dist"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
