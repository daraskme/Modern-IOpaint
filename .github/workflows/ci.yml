name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff only
        run: python -m pip install ruff
      - name: Ruff
        run: |
          python -m ruff check --select E9 modern_iopaint scripts hatch_build.py
          python -m ruff check hatch_build.py modern_iopaint/gpu_setup.py scripts/update_wheel_hashes.py scripts/update_oneclick_pins.py scripts/build_oneclick_zip.py
      - name: Compile Python sources
        run: python -m compileall -q modern_iopaint scripts hatch_build.py

  wheel:
    name: Frontend and wheel
    needs: python-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_app/package-lock.json
      - name: Build frontend
        working-directory: web_app
        run: |
          npm ci
          npm run build
      - name: Install Hatch
        run: python -m pip install hatch
      - name: Build wheel with bundled frontend
        run: python -m hatch build --target wheel
      - uses: actions/upload-artifact@v4
        with:
          name: modern-iopaint-wheel
          path: dist/*.whl
          if-no-files-found: error
